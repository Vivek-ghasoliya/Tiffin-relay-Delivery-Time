data:
  train_path: data/raw/train.csv
  later_path: data/raw/later.csv
  holdout_path: data/raw/holdout_features.csv
  cleaned_train_path: data/processed/train_clean.csv
  unit_mixup_factor: 60
  unit_mixup_zone: Old City
  sentinel_handovers: -1
  target_typo_threshold: 150.0

model:
  name: mp253-tiffin-delivery
  experiment_name: mp253_tiffin_relay
  random_state: 42
  test_size: 0.2
  n_estimators: 100
  max_depth: 8